name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "session/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome (lint + format check)
        run: npx biome ci .

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests (node:test)
        run: npm test

      - name: Install browser for invitation regression
        run: npx playwright install --with-deps chromium

      - name: First activation on served HTML
        run: npm run test:browser

      - name: Publication and release evidence checks
        run: python3 -m unittest discover -s docs/validation/provider-registry-session/preproduction -p 'test_release*.py'

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        shell: bash
        run: |
          if git grep -nI -E "sk-[A-Za-z0-9]{20,}" -- . ":(exclude)package-lock.json" ":(exclude)*.md" ":(exclude).github" ":(exclude)*.test.mjs"; then
            echo "::error::Secret-like pattern found in tracked files"
            exit 1
          fi
          echo "No secrets detected."
