name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome (lint + format check)
        run: npx biome ci .

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests (node:test)
        run: npm test

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        shell: bash
        run: |
          if git grep -nI -E "(ELEVENLABS_API_KEY[[:space:]]*=[[:space:]]*[^\"$(]|sk-[A-Za-z0-9]{20,}|xi-api-key[[:space:]]*:[[:space:]]*[^\"$(])" -- . ":!package-lock.json" ":!*.md" ":!.github"; then
            echo "::error::Secret-like pattern found in tracked files"
            exit 1
          fi
          echo "No secrets detected."
